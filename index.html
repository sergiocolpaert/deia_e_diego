<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andrea &amp; Diego · 03.04.2027</title>
    <meta name="description" content="Andrea &amp; Diego — 3 de abril de 2027, Espaço Barcelona, Niterói." />
    <meta name="theme-color" content="#F7F3EE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Esconde elementos animados antes do 1º paint; failsafe se o JS não carregar -->
    <script>
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion');
        setTimeout(() => window.__motionReady || document.documentElement.classList.remove('motion'), 3000);
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@400;500&family=Montserrat:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <header class="topbar">
      <nav class="lang-switch" data-i18n-attr="aria-label:meta.langLabel">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <span aria-hidden="true">·</span>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </nav>
    </header>

    <main>
      <!-- 1. Hero -->
      <section class="hero" id="inicio">
        <!-- Aquarelas de canto (brand book: "usar com moderação") -->
        <div class="deco deco--hero-stain-tr" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/faixa-pessego.webp" alt="" width="800" height="374" fetchpriority="high" decoding="async" /></div>
        <div class="deco deco--hero-roses" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/buque-rosas.webp" alt="" width="800" height="686" fetchpriority="high" decoding="async" /></div>
        <div class="deco deco--hero-stain-bl" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/faixa-verde-terracota.webp" alt="" width="800" height="310" fetchpriority="high" decoding="async" /></div>
        <div class="deco deco--hero-sprig" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/raminho-flores.webp" alt="" width="244" height="566" fetchpriority="high" decoding="async" /></div>
        <div class="hero__inner">
          <p class="eyebrow" data-reveal="intro" data-i18n="hero.eyebrow"></p>
          <div class="monogram hero__monogram" data-reveal="intro" role="img" aria-label="A & D"></div>
          <h1 class="hero__names" data-reveal="intro"><span>Andrea</span> <span><span class="hero__amp">&amp;</span> Diego</span></h1>
          <span class="hero__dots" data-ornament="dots" data-reveal="intro"></span>
          <p class="hero__date" data-reveal="intro"><time datetime="2027-04-03" data-i18n="hero.date"></time></p>
          <p class="hero__place" data-reveal="intro" data-i18n="hero.place"></p>
          <p class="hero__tagline" data-reveal="intro" data-i18n="hero.tagline"></p>
        </div>
        <a class="hero__scroll" href="#carta" data-reveal="intro">
          <span data-i18n="hero.scroll"></span>
          <span class="hero__scroll-line" aria-hidden="true"></span>
        </a>
      </section>

      <!-- 2. Carta -->
      <section class="letter" id="carta" aria-labelledby="letter-greeting">
        <article class="letter__paper" data-reveal>
          <div class="deco deco--letter-olive" aria-hidden="true"><img src="/src/assets/brand/ramo-oliveira.webp" alt="" width="894" height="470" loading="lazy" decoding="async" /></div>
          <p class="letter__greeting" id="letter-greeting" data-i18n="letter.greeting"></p>
          <div class="letter__body" data-i18n-list="letter.body"></div>
          <footer class="letter__sign">
            <img class="letter__heart" src="/src/assets/brand/coracao.webp" alt="" width="107" height="111" loading="lazy" decoding="async" />
            <p class="letter__closing" data-i18n="letter.closing"></p>
            <p class="letter__signature" data-i18n="letter.signature"></p>
          </footer>
          <div class="seal seal--letter" data-reveal="stamp" role="img" aria-label="A & D"></div>
        </article>
      </section>

      <!-- 3. Três países (conceito do brand book) -->
      <section class="countries" id="tres-paises" aria-labelledby="countries-title">
        <h2 class="section-title" id="countries-title" data-reveal data-i18n="countries.title"></h2>
        <p class="countries__intro" data-reveal data-i18n="countries.intro"></p>
        <div class="countries__route" data-reveal="route">
          <img class="countries__birds" src="/src/assets/brand/passaros.webp" alt="" width="478" height="173" loading="lazy" decoding="async" />
          <span class="countries__dots" data-ornament="dots"></span>
          <ol class="countries__list">
            <li>
              <span class="countries__name" data-i18n="countries.list.0.name"></span>
              <span class="countries__note" data-i18n="countries.list.0.note"></span>
            </li>
            <li>
              <span class="countries__name" data-i18n="countries.list.1.name"></span>
              <span class="countries__note" data-i18n="countries.list.1.note"></span>
            </li>
            <li>
              <span class="countries__name" data-i18n="countries.list.2.name"></span>
              <span class="countries__note" data-i18n="countries.list.2.note"></span>
            </li>
          </ol>
        </div>
      </section>

      <!-- 4. Galeria -->
      <section class="gallery" id="fotos" aria-labelledby="gallery-title">
        <div class="deco deco--gallery-stain" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/faixa-terracota-oliva.webp" alt="" width="800" height="332" loading="lazy" decoding="async" /></div>
        <h2 class="section-title" id="gallery-title" data-reveal data-i18n="gallery.title"></h2>
        <div class="gallery__grid" data-gallery></div>
      </section>

      <!-- 5. Informações -->
      <section class="details" id="informacoes" aria-labelledby="details-title">
        <p class="eyebrow" data-reveal data-i18n="details.eyebrow"></p>
        <h2 class="section-title" id="details-title" data-reveal data-i18n="details.title"></h2>
        <dl class="details__list">
          <div class="details__item" data-reveal>
            <dt data-i18n="details.when.label"></dt>
            <dd>
              <span class="details__value" data-i18n="details.when.value"></span>
              <span class="details__sub" data-i18n="details.when.sub"></span>
            </dd>
          </div>
          <div class="details__item" data-reveal>
            <dt data-i18n="details.where.label"></dt>
            <dd>
              <span class="details__value" data-i18n="details.where.value"></span>
              <span class="details__sub" data-i18n="details.where.sub"></span>
              <span class="details__note" data-i18n="details.where.note"></span>
            </dd>
          </div>
          <div class="details__item" data-reveal>
            <dt data-i18n="details.dress.label"></dt>
            <dd>
              <span class="details__value" data-i18n="details.dress.value"></span>
              <span class="details__sub" data-i18n="details.dress.sub"></span>
            </dd>
          </div>
        </dl>
      </section>

      <!-- 6. Como chegar -->
      <section class="map" id="como-chegar" aria-labelledby="map-title">
        <figure class="map__figure" data-reveal>
          <img src="/src/assets/brand/pao-de-acucar.webp" width="1061" height="746" loading="lazy" decoding="async" data-i18n-attr="alt:map.alt" />
        </figure>
        <div class="map__body" data-reveal>
          <h2 class="section-title" id="map-title" data-i18n="map.title"></h2>
          <a class="btn btn--ghost" data-maps target="_blank" rel="noopener">
            <span data-i18n="map.cta"></span> <span aria-hidden="true">↗</span>
          </a>
        </div>
      </section>

      <!-- 7. RSVP -->
      <section class="rsvp" id="rsvp" aria-labelledby="rsvp-title">
        <h2 class="rsvp__title" data-reveal id="rsvp-title" data-i18n="rsvp.title"></h2>
        <p class="rsvp__body" data-reveal data-i18n="rsvp.body"></p>
        <div class="rsvp__action" data-reveal>
          <a class="btn btn--primary" data-rsvp target="_blank" rel="noopener">
            <span data-i18n="rsvp.cta"></span>
          </a>
          <p class="rsvp__pending" data-rsvp-pending data-i18n="rsvp.pending" hidden></p>
        </div>
      </section>
    </main>

    <!-- 8. Rodapé -->
    <footer class="site-footer">
      <div class="deco deco--footer-palms" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/palmeiras-mancha.webp" alt="" width="466" height="752" loading="lazy" decoding="async" /></div>
      <div class="deco deco--footer-stain" data-reveal="deco" aria-hidden="true"><img src="/src/assets/brand/mancha-terracota-oliva.webp" alt="" width="800" height="544" loading="lazy" decoding="async" /></div>
      <div class="seal seal--small" data-reveal="stamp" role="img" aria-label="A & D"></div>
      <p class="site-footer__signoff" data-reveal data-i18n="footer.signoff"></p>
      <p class="site-footer__line" data-i18n="footer.line"></p>
      <p class="site-footer__tagline" data-i18n="footer.tagline"></p>
      <p class="site-footer__credit" data-i18n="footer.credit"></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
